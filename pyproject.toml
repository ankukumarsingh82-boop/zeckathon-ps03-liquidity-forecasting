[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liqfc"
version = "0.2.0"
description = "AMFI Liquid/Overnight net-flow forecasting and cash-buffer sizing (local tool)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
